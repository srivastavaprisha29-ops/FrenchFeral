const bands = ["","Foundations","Everyday independence","Academic conversations"];
const key = "frenchferal.v1";
const blank = () => ({runs:[],items:{},daily:null});
let data = blank();
let storageAvailable = true;
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if(saved && Array.isArray(saved.runs) && saved.items) data = saved;
} catch { storageAvailable = false; }
const app = document.querySelector("#app");
const notice = document.querySelector("#notice");
let page = "today", session = null;
function persist(){
  try { localStorage.setItem(key,JSON.stringify(data)); }
  catch { storageAvailable = false; notice.textContent = "Progress could not be saved on this browser."; }
}
function day(date = new Date()){
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");
}
const escaped = value => String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const normalize = value => value.normalize("NFD").toLowerCase().replace(/\p{M}/gu,"").replace(/[^\p{L}\p{N}]+/gu," ").trim();
const correct = (answer,lesson) => lesson.answers.some(value=>normalize(value)===normalize(answer));
const studied = id => data.runs.some(run=>run.id===id);
const checked = id => data.runs.some(run=>run.id===id && run.correct);
function level(){
  if(lessons.filter(l=>l.level===2 && checked(l.id)).length>=3) return 3;
  if(lessons.filter(l=>l.level===1 && checked(l.id)).length>=3) return 2;
  return 1;
}
function misses(){return lessons.filter(l=>data.items[l.id]?.weak);}
function reviewItems(exclude=-1,limit=2){
  const seen = lessons.filter(l=>l.id!==exclude && data.items[l.id]);
  return seen.sort((a,b)=>Number(data.items[b.id].weak)-Number(data.items[a.id].weak)||data.items[a.id].at-data.items[b.id].at).slice(0,limit);
}
function daily(){
  if(data.daily?.day===day()) return lessons[data.daily.id];
  const pool = lessons.filter(l=>l.level===level());
  const next = pool.find(l=>!studied(l.id))||pool.find(l=>!checked(l.id))||reviewItems(-1,12).find(l=>l.level===level())||pool[0];
  data.daily={day:day(),id:next.id};
  persist();
  return next;
}
function record(id,passed){
  data.items[id]={weak:!passed,at:Date.now()};
  persist();
}
function streak(){
  const dates=new Set(data.runs.map(r=>r.day));
  const cursor=new Date();
  if(!dates.has(day(cursor))) cursor.setDate(cursor.getDate()-1);
  let count=0;
  while(dates.has(day(cursor))){count++;cursor.setDate(cursor.getDate()-1);}
  return count;
}
function listen(text){
  if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){
    notice.textContent="Read the French text aloud. Audio playback is unavailable.";
    return;
  }
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="fr-FR";utterance.rate=.86;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}
const listenButton = text => '<button class="listen" type="button" data-listen="'+escaped(text)+'" aria-label="Listen in French">♪ Listen</button>';
function btn(action,label,value="",style="button"){
  return '<button type="button" class="'+style+'" data-action="'+action+'" data-value="'+value+'">'+label+'</button>';
}
function intro(title,subtitle){return '<div class="intro"><h1>'+title+'</h1><p class="muted">'+subtitle+'</p></div>';}
function today(){
  const lesson = daily();
  const completed = data.runs.some(run => run.day === day() && run.id === lesson.id);
  const scenes = [
    ["campus","On campus"],
    ["cafe","At the café"],
    ["library","At the library"],
    ["metro","On the métro"]
  ];
  return `<section class="cover">
    <img class="cover-art" src="paris-collage.webp" alt="" fetchpriority="high">
    <div class="shell"><div class="cover-copy">
      <div class="eyebrow">French for student life</div>
      <h1 lang="fr">Bonjour,<br> <em>Paris.</em></h1>
      <p>Short daily French sessions for campus and everyday conversations in Paris.</p>
      <small class="session-label">${completed ? "Session complete" : "Today’s session"} · ${lesson.title} · 5–8 min</small>
      ${btn("start", completed ? "Practice again →" : "Start session →", lesson.id)}
    </div></div>
  </section>
  <section class="shell studies" aria-labelledby="scenes-title">
    <div class="studies-head">
      <div><div class="eyebrow">Lessons from everyday life</div><h2 id="scenes-title">Find your words in Paris</h2></div>
      ${btn("go","View all lessons →","lessons","ghost")}
    </div>
    <div class="scenes">${scenes.map(([image,place], index) => `<button class="scene" data-action="start" data-value="${index}">
      <img src="${image}.webp" alt="" loading="lazy">
      <span class="eyebrow">${place}</span>
      <span class="scene-name">${lessons[index].title}</span>
      <span class="scene-arrow" aria-hidden="true">→</span>
    </button>`).join("")}</div>
    <div class="field-notes" aria-label="Practice overview">
      <div><span class="eyebrow">Streak</span><strong>${streak()} ${streak() === 1 ? "day" : "days"}</strong></div>
      <div><span class="eyebrow">Difficulty</span><strong>${bands[level()]}</strong></div>
      <div><span class="eyebrow">Weak points</span><strong>${misses().length}</strong></div>
    </div>
  </section>`;
}
function library(){
  return intro("Lessons","Practice campus, everyday, and academic conversations.")+
  bands.slice(1).map((name,i)=>'<section class="section card"><h3>'+name+'</h3><ul class="rows">'+lessons.filter(l=>l.level===i+1).map(l=>'<li><div><strong>'+l.title+'</strong><small>'+l.description+'</small></div>'+(l.level<=level()?btn("start",studied(l.id)?"Practice again":"Start",l.id,"ghost"):'<span class="pill">Locked</span>')+'</li>').join("")+'</ul></section>').join("");
}
function review(){
  const weak=misses(), previous=reviewItems(-1,12).filter(l=>!data.items[l.id].weak);
  return intro("Review","Recall phrases from earlier sessions and retry missed prompts.")+
  '<section class="card"><h3>Weak points</h3>'+ (weak.length?'<ul class="rows">'+weak.map(reviewRow).join("")+'</ul>':'<p class="muted">No missed prompts to revisit.</p>')+'</section>'+
  '<section class="section card"><h3>Earlier lessons</h3>'+ (previous.length?'<ul class="rows">'+previous.map(reviewRow).join("")+'</ul>':'<p class="muted">Submit a checkpoint to add a prompt to your review.</p>')+'</section>';
}
function reviewRow(l){return '<li><strong>'+l.title+'</strong>'+btn("review","Recall phrase",l.id,"ghost")+'</li>';}
function progress(){
  const scored=data.runs.length, rate=scored?Math.round(100*data.runs.filter(r=>r.correct).length/scored)+"%":"—";
  const passes=lessons.filter(l=>l.level===level()&&checked(l.id)).length;
  return intro("Progress","Track practice days, checkpoint accuracy, and difficulty.")+
  '<div class="progress-grid"><div class="card"><strong>'+lessons.filter(l=>studied(l.id)).length+' / '+lessons.length+'</strong>Lessons done</div><div class="card"><strong>'+rate+'</strong>Checkpoint accuracy</div><div class="card"><strong>'+streak()+'</strong>Day streak</div></div>'+
  '<section class="section card"><h3>'+bands[level()]+'</h3><p>'+(level()<3?passes+' / 3 distinct lesson checkpoints passed at this level. Pass three to unlock '+bands[level()+1]+'.':'You’ve unlocked all three difficulty levels.')+'</p>'+(level()<3?'<div class="meter" role="progressbar" aria-label="Difficulty unlock" aria-valuenow="'+passes+'" aria-valuemin="0" aria-valuemax="3"><span style="width:'+Math.min(100,passes/3*100)+'%"></span></div>':'')+'</section>'+
  '<section class="section card"><h3>Recent sessions</h3>'+(scored?'<ul class="rows">'+data.runs.slice().reverse().slice(0,10).map(r=>'<li><div><strong>'+lessons[r.id].title+'</strong><small>'+r.day+' · '+(r.correct?"Checkpoint passed":"Checkpoint missed")+'</small></div><details><summary>My response</summary><div class="answer">'+escaped(r.writing)+'</div></details></li>').join("")+'</ul>':'<p class="muted">Complete a session to see it here.</p>')+'</section><p class="note">'+(storageAvailable?"Progress and responses are saved in this browser.":"Browser storage is unavailable. Progress lasts for this open tab.")+'</p>';
}
function start(id,reviewOnly){
  const lesson=lessons[id];
  if(!lesson || lesson.level>level()) return;
  const steps=reviewOnly?[{kind:"recall",lesson}]:[
    ...reviewItems(id).map(item=>({kind:"recall",lesson:item})),
    {kind:"vocab",lesson},{kind:"dialogue",lesson},{kind:"checkpoint",lesson},{kind:"response",lesson}
  ];
  session={lesson,steps,index:0,result:null,checkpoint:false,reviewOnly,done:false};
  page="practice";render(true);
}
function quiz(lesson,result){
  return '<div class="card"><p>'+lesson.prompt+'</p>'+(result?
    '<div class="feedback '+(result.passed?"":"try")+'" role="status"><strong>'+(result.passed?"Correct":"Compare with the model")+'</strong><br>Your answer <span class="answer" lang="fr">'+escaped(result.answer)+'</span><br>Model answer <strong lang="fr">'+lesson.answers[0]+'</strong></div><details><summary>About matching</summary>Checkpoint scoring accepts the listed phrase variants and ignores case, accents, and punctuation. Other valid phrasings may be marked for review.</details><div class="actions">'+btn("next",session.reviewOnly?"Back to review →":"Continue →")+'</div>':
    '<form data-form="quiz"><label for="answer">Your answer in French</label><textarea id="answer" lang="fr" name="answer" required maxlength="500" spellcheck="false"></textarea><div class="actions"><button class="button">Check answer</button></div></form>')+'</div>';
}
function practice(){
  const s=session;
  if(s.done) return '<div class="practice"><div class="eyebrow">Session complete</div><h2>'+s.lesson.title+'</h2><div class="card"><p>'+(s.checkpoint?'Checkpoint passed.':'Checkpoint missed. You can retry the phrase in Review.')+'</p><p>Response saved '+(storageAvailable?'in this browser.':'for this tab.')+'</p><div class="actions">'+btn("go","Back to today →","today")+btn("go","View progress","progress","ghost")+'</div></div></div>';
  const {kind,lesson}=s.steps[s.index];
  const titles={recall:"Quick review",vocab:"Useful vocabulary",dialogue:"Read the dialogue",checkpoint:"Checkpoint",response:"Make it your own"};
  let content="";
  if(kind==="recall"||kind==="checkpoint") content=quiz(lesson,s.result);
  if(kind==="vocab") content='<div class="card"><ul class="vocab">'+lesson.vocab.map(([fr,en])=>'<li><div><strong lang="fr">'+fr+'</strong><small>'+en+'</small></div>'+listenButton(fr)+'</li>').join("")+'</ul><div class="actions">'+btn("next","Read the dialogue →")+'</div></div>';
  if(kind==="dialogue") content='<div class="card">'+listenButton(lesson.dialogue.map(line=>line[1]).join(" "))+
    lesson.dialogue.map(([who,fr,en])=>'<div class="dialogue"><strong>'+who+'</strong><p lang="fr">'+fr+'</p><details><summary>English</summary><small>'+en+'</small></details></div>').join("")+'<div class="actions">'+btn("next","Try the checkpoint →")+'</div></div>';
  if(kind==="response") content='<div class="card"><p>'+lesson.task+'</p><p class="muted">Write your response, or say it aloud and type what you said.</p>'+(s.result?
    '<div class="feedback"><strong>Your response</strong><div class="answer" lang="fr">'+escaped(s.result.answer)+'</div><p><strong>Model response</strong><br><span lang="fr">'+lesson.model+'</span></p>'+listenButton(lesson.model)+'<p><strong>Self-check</strong><br>'+lesson.check+'</p></div><div class="actions">'+btn("next","Finish session →")+'</div>':
    '<form data-form="response"><label for="answer">Your response in French</label><textarea id="answer" lang="fr" name="answer" required maxlength="1200"></textarea><div class="actions"><button class="button">Submit response</button></div></form>')+'</div>';
  return '<div class="practice"><div class="step-head">'+btn("go",s.reviewOnly?"← Review":"← Today",s.reviewOnly?"review":"today","ghost")+'<span class="pill">'+(s.index+1)+' / '+s.steps.length+'</span></div><div class="meter" role="progressbar" aria-label="Session step" aria-valuenow="'+(s.index+1)+'" aria-valuemin="0" aria-valuemax="'+s.steps.length+'"><span style="width:'+((s.index+1)/s.steps.length*100)+'%"></span></div><h2>'+titles[kind]+'</h2><div class="eyebrow" lang="fr">'+lesson.fr+'</div>'+content+'</div>';
}
function render(focus=false){
  const views={today,lessons:library,review,progress,practice};
  app.classList.toggle("home",page==="today");
  app.innerHTML=views[page]();
  document.querySelectorAll("header button[data-page]").forEach(button=>{
    if(button.dataset.page===page)button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  });
  if(focus){app.focus({preventScroll:true});window.scrollTo(0,0);}
}
function go(destination){session=null;page=destination;render(true);}
document.addEventListener("click",event=>{
  const button=event.target.closest("button");
  if(!button)return;
  const {page:destination,action,value,listen:phrase}=button.dataset;
  if(destination)go(destination);
  if(phrase)listen(phrase);
  if(action==="go")go(value);
  if(action==="daily")start(daily().id,false);
  if(action==="start"||action==="review")start(Number(value),action==="review");
  if(action!=="next"||!session)return;
  if(session.reviewOnly){go("review");return;}
  if(session.index===session.steps.length-1){session.done=true;}
  else{session.index++;session.result=null;}
  render(true);
});
app.addEventListener("submit",event=>{
  event.preventDefault();
  if(!session||session.result)return;
  const input=event.target.elements.answer;
  const answer=input.value.trim();
  if(!answer){input.setCustomValidity("Enter a response in French.");input.reportValidity();input.addEventListener("input",()=>input.setCustomValidity(""),{once:true});return;}
  const {kind,lesson}=session.steps[session.index];
  if(kind==="response"){
    session.result={answer};
    data.runs.push({id:lesson.id,day:day(),correct:session.checkpoint,writing:answer});
    persist();
  }else{
    const passed=correct(answer,lesson);
    session.result={answer,passed};
    record(lesson.id,passed);
    if(kind==="checkpoint")session.checkpoint=passed;
  }
  render(true);
});
render();
</script></body></html>
