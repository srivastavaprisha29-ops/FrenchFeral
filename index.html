const lessons = [

[["la salle","the classroom"],["au deuxième étage","on the second floor"],["le cours","the class"]],
[["Vous","Bonjour, où se trouve la salle 204 ?","Hello, where is room 204?"],["Étudiante","Au deuxième étage, à gauche.","On the second floor, on the left."],["Vous","Merci ! Le cours commence à neuf heures ?","Thanks! Does class start at nine?"],["Étudiante","Oui, on a encore dix minutes.","Yes, we still have ten minutes."]],
"Say “Where is room 204?”",["Où se trouve la salle 204 ?","Où est la salle 204 ?"],"Ask where your classroom is, then check if class starts at nine.","Bonjour, où se trouve la salle 204 ? Le cours commence à neuf heures ?","A greeting, a room question, and the time neuf heures."],
[1,"Ordering at a café","Au café","Order a drink and say whether you’re staying.",

[["Serveuse","Bonjour, qu’est-ce que je vous sers ?","Hello, what can I get you?"],["Vous","Je voudrais un café crème, s’il vous plaît.","I’d like a coffee with milk, please."],["Serveuse","Sur place ou à emporter ?","For here or to go?"],["Vous","À emporter, merci.","To go, thanks."]],

[1,"Borrowing a book","À la bibliothèque","Ask to borrow a book and check the return date.",

"Say “Can I borrow this book?”",["Je peux emprunter ce livre ?","Est-ce que je peux emprunter ce livre ?","Puis-je emprunter ce livre ?"],"Ask to borrow a book and find out when you must return it.","Je peux emprunter ce livre ? Quand est-ce que je dois le rendre ?","Use emprunter for borrowing and rendre for returning."],
[1,"Taking the métro","Dans le métro","Ask about a connection and confirm which way to go.",
[["la correspondance","the transfer"],["la direction","the direction"],["le quai","the platform"]],
[["Vous","Excusez-moi, où est la correspondance pour la ligne 6 ?","Excuse me, where’s the transfer to line 6?"],["Passant","Suivez les panneaux bleus, puis descendez l’escalier.","Follow the blue signs, then go down the stairs."],["Vous","Merci ! C’est bien par là ?","Thanks! Is it this way?"],["Passant","Oui, tout droit.","Yes, straight ahead."]],

"Say “Can I email it to you?”",["Est-ce que je peux vous l’envoyer par mail ?","Je peux vous l’envoyer par mail ?","Puis-je vous l’envoyer par mail ?","Est-ce que je peux vous l’envoyer par e-mail ?"],"Write two lines to the office saying your proof of address is attached. Include a placeholder student number.","Bonjour, vous trouverez mon justificatif de domicile en pièce jointe. Mon numéro étudiant est le 123456. Cordialement.","Name the document, use en pièce jointe, and include the number."],

[["Vous","Tu es disponible jeudi pour répartir les tâches ?","Are you free Thursday to divide up the tasks?"],["Camarade","J’ai cours jusqu’à dix-huit heures. On peut décaler à vendredi ?","I have class until six. Can we move it to Friday?"],["Vous","Oui, vendredi à midi, ça te va ?","Yes, does Friday at noon work for you?"],["Camarade","Parfait, on se retrouve à la bibliothèque.","Perfect, let’s meet at the library."]],
"Say “Does Friday at noon work for you?” using tu.",["Vendredi à midi, ça te va ?","Ça te va vendredi à midi ?","Est-ce que vendredi à midi te va ?"],"Tell a classmate you have class Thursday and suggest Friday at noon at the library.","J’ai cours jeudi. On peut se retrouver vendredi à midi à la bibliothèque ?","Give a reason, a new time, and a meeting place."],
[2,"Viewing a room","Visiter une chambre","Check what the rent includes and suggest a viewing.",
[["le loyer","the rent"],["charges comprises","utilities or service charges included"],["une visite","a viewing"]],
[["Vous","Bonjour, la chambre est toujours disponible ?","Hello, is the room still available?"],["Propriétaire","Oui, le loyer est de 650 euros, charges comprises.","Yes, rent is €650, charges included."],["Vous","Est-ce que le chauffage est compris ?","Is heating included?"],["Propriétaire","Oui. Vous voulez venir la voir samedi ?","Yes. Would you like to see it Saturday?"]],
"Ask “Is heating included?”",["Est-ce que le chauffage est compris ?","Le chauffage est compris ?","Le chauffage est-il compris ?","Le chauffage est inclus ?"],"Ask if the room is available and propose a viewing Saturday morning.","Bonjour, la chambre est-elle toujours disponible ? Serait-il possible de la visiter samedi matin ?","Ask about availability and suggest a specific time politely."],
[2,"Following up after a lecture","Après le cours","Ask a lecturer to clarify what you need to submit.",
[["la consigne","the instruction"],["le compte rendu","the written report"],["rendre un devoir","to submit an assignment"]],
[["Vous","Bonjour Madame, j’ai une question sur la consigne.","Hello, I have a question about the instructions."],["Enseignante","Oui, je vous écoute.","Yes, go ahead."],["Vous","Est-ce qu’on doit rendre un compte rendu individuel ?","Do we have to submit an individual report?"],["Enseignante","Non, un seul compte rendu par groupe suffit.","No, one report per group is enough."]],
"Translate “one report per group”.",["Un compte rendu par groupe","Un seul compte rendu par groupe"],"Ask your lecturer whether the report is individual and when it is due.","Bonjour Madame, est-ce que le compte rendu est individuel ? Pour quand faut-il le rendre ?","Address the lecturer politely and ask both questions."],
[3,"Requesting an extension","Demander un délai","Explain a setback and propose a specific new deadline.",
[["un délai supplémentaire","an extension"],["la date limite","the deadline"],["un imprévu","an unexpected problem"]],
[["Vous","Je vous écris au sujet du devoir à rendre lundi.","I’m writing about the assignment due Monday."],["Vous","À cause d’un imprévu, je crains de ne pas pouvoir respecter la date limite.","Because something came up, I’m afraid I won’t be able to meet the deadline."],["Enseignant","De combien de temps auriez-vous besoin ?","How much extra time would you need?"],["Vous","Serait-il possible de vous rendre le devoir mercredi ?","Would it be possible to submit the assignment to you on Wednesday?"]],
"Translate “an extension” using délai.",["Un délai supplémentaire"],"Write a three-sentence email requesting a two-day extension for an assignment due Monday.","Bonjour Monsieur, à cause d’un imprévu, je crains de ne pas pouvoir rendre le devoir lundi. Serait-il possible de bénéficier d’un délai de deux jours et de vous le remettre mercredi ? Je vous remercie de votre compréhension.","Mention the original deadline, state your reason briefly, and request a new date with the conditional."],
[3,"Speaking up in a seminar","Prendre la parole","Acknowledge someone’s point and offer a qualified disagreement.",
[["cela dit","that said"],["nuancer","to qualify or add nuance"],["dans quelle mesure","to what extent"]],
[["Camarade","À mon avis, les cours à distance sont plus accessibles.","In my view, online classes are more accessible."],["Vous","Je comprends ton point de vue. Cela dit, tout le monde n’a pas une connexion fiable.","I see your point. That said, not everyone has a reliable connection."],["Enseignante","Dans quelle mesure cela change-t-il votre avis ?","To what extent does that change your view?"],["Vous","Je dirais que cela dépend du type de cours.","I’d say it depends on the type of class."]],
"Translate “to what extent”.",["Dans quelle mesure"],"Respond to a classmate who says all lectures should be online. Acknowledge one benefit, then qualify their claim.","Je comprends ton point de vue : on gagne du temps sur les trajets. Cela dit, certains cours se prêtent mieux aux échanges en salle. Je dirais que cela dépend du cours.","Acknowledge a benefit and connect your qualification with cela dit."],

[["en semaine","on weekdays"],["se mettre d’accord","to come to an agreement"],["faire moins de bruit","to make less noise"]],
[["Vous","Est-ce qu’on pourrait parler du bruit le soir ? J’ai du mal à me concentrer.","Could we talk about the noise in the evening? I’m having trouble concentrating."],["Colocataire","Bien sûr. Tu voudrais qu’on baisse la musique à partir de quelle heure ?","Of course. What time would you like us to turn the music down?"],["Vous","Est-ce qu’on pourrait se mettre d’accord sur vingt-deux heures en semaine ?","Could we agree on ten p.m. on weekdays?"],["Colocataire","Ça marche. On peut en reparler si besoin.","That works. We can talk about it again if needed."]],
"Translate “to come to an agreement”.",["Se mettre d’accord","Se mettre d'accord"],"Ask your flatmate to turn down the music after 10 p.m. on weekdays. Explain why and invite their input.","J’ai du mal à travailler quand la musique est forte. Est-ce qu’on pourrait la baisser à partir de vingt-deux heures en semaine ? Qu’est-ce que tu en penses ?","Explain the impact, make a concrete request, and ask what they think."],

[["Encadrante","Que montrent vos premiers résultats ?","What do your first results show?"],["Vous","Ils semblent confirmer notre hypothèse, mais l’échantillon est encore réduit.","They seem to confirm our hypothesis, but the sample is still small."],["Encadrante","Qu’est-ce qu’il reste à vérifier ?","What still needs to be verified?"],["Vous","Il reste à vérifier si les résultats se reproduisent sur un échantillon plus large.","We still need to verify whether the results are reproducible with a larger sample."]],

const bands = ["","Foundations","Everyday independence","Academic conversations"];
const key = "frenchferal.v1";
const blank = () => ({version:2,total:0,passed:0,mastery:{},items:{},daily:null,lastDay:null,streak:0});
let data = blank();
let storageAvailable = true;
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if(saved?.version===2) data=saved;
  else if(Array.isArray(saved?.runs)){
    const dates=new Set();
    for(const run of saved.runs){
      addToTotals(run.id,run.correct);
      dates.add(run.day);
    }
    for(const lesson of lessons){
      if(saved.items?.[lesson.id]) data.items[lesson.id]={weak:Boolean(saved.items[lesson.id].weak)};
    }
    const latest=[...dates].sort().at(-1);
    if(latest){
      data.lastDay=latest;
      const cursor=new Date(latest+"T12:00:00");
      while(dates.has(day(cursor))){data.streak++;cursor.setDate(cursor.getDate()-1);}
    }
    if(lessons[saved.daily?.id] && saved.daily.day===day()){
      data.daily={day:saved.daily.day,id:saved.daily.id,complete:saved.runs.some(run=>run.day===saved.daily.day&&run.id===saved.daily.id)};
    }
    localStorage.setItem(key,JSON.stringify(data));
  }
} catch { storageAvailable = false; }
const app = document.querySelector("#app");
const notice = document.querySelector("#notice");
let page = "today", session = null;
function persist(){
  try { localStorage.setItem(key,JSON.stringify(data)); }
  catch { storageAvailable = false; notice.textContent = "Progress could not be saved on this browser."; }
}
function day(date = new Date()){
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");
}
const escaped = value => String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const normalize = value => value.normalize("NFD").toLowerCase().replace(/\p{M}/gu,"").replace(/[^\p{L}\p{N}]+/gu," ").trim();
const correct = (answer,lesson) => lesson.answers.some(value=>normalize(value)===normalize(answer));
const studied = id => Boolean(data.mastery[id]);
const checked = id => data.mastery[id]===2;
function addToTotals(id,passed){
  data.total++;
  if(passed)data.passed++;

function level(){
  if(lessons.filter(l=>l.level===2 && checked(l.id)).length>=3) return 3;

  return 1;
}

function reviewItems(exclude=-1,limit=2){
  const seen = lessons.filter(l=>l.id!==exclude && data.items[l.id]);

  if(data.daily?.day===day()) return lessons[data.daily.id];

  const next = pool.find(l=>!studied(l.id))||pool.find(l=>!checked(l.id))||pool[Math.floor(Date.now()/86400000)%pool.length];
  data.daily={day:day(),id:next.id,complete:false};

  }));
  form.innerHTML=grammarForm(grammarChapters[grammarIndex],grammarResults)+'<button class="button">Check grammar</button>';
  notice.textContent=grammarResults.filter(result=>result.correct).length+" of "+grammarResults.length+" correct";
  form.querySelector("button").focus({preventScroll:true});
}

function render(focus=false){
  const views={today,lessons:library,grammar,review,progress,practice};
  app.classList.toggle("home",page==="today");
  app.innerHTML=views[page]();
  document.querySelectorAll("header button[data-page]").forEach(button=>{
    if(button.dataset.page===page)button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  });
  if(focus){app.focus({preventScroll:true});window.scrollTo(0,0);}
}
function go(destination){session=null;grammarIndex=null;grammarResults=null;page=destination;render(true);}
document.addEventListener("click",event=>{
  const button=event.target.closest("button");
  if(!button)return;
  const {page:destination,action,value,listen:phrase}=button.dataset;
  if(destination)go(destination);
  if(phrase)listen(phrase);
  if(action==="go")go(value);
  if(action==="grammar"){grammarIndex=Number(value);grammarResults=null;render(true);}
  if(action==="daily")start(daily().id,false);
  if(action==="start"||action==="review")start(Number(value),action==="review");
  if(action!=="next"||!session)return;
  if(session.reviewOnly){go("review");return;}
  if(session.index===session.steps.length-1){session.done=true;session.result=null;}
  else{session.index++;session.result=null;}
  render(true);
});
app.addEventListener("submit",event=>{
  event.preventDefault();
  if(event.target.dataset.form==="grammar"){checkGrammar(event.target);return;}
  if(!session||session.result)return;
  const input=event.target.elements.answer;
  const answer=input.value.trim();
  if(!answer){input.setCustomValidity("Enter a response in French.");input.reportValidity();input.addEventListener("input",()=>input.setCustomValidity(""),{once:true});return;}
  const {kind,lesson}=session.steps[session.index];
  if(kind==="response"){
    session.result={answer};
    completeLesson(lesson.id,session.checkpoint);
  }else{
    const passed=correct(answer,lesson);
    session.result={answer,passed};
    record(lesson.id,passed);
    if(kind==="checkpoint")session.checkpoint=passed;
  }
  render(true);
});
render();
</script></body></html>
